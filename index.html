<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Pekerja</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-12">

    <!-- Header Navigation -->
    <header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i data-lucide="camera" class="w-7 h-7"></i>
                <h1 class="text-xl font-bold tracking-wide">Absensi Pekerja</h1>
            </div>
            <span class="text-xs bg-indigo-700 border border-indigo-500 text-indigo-100 px-2.5 py-1 rounded-full font-medium flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Online
            </span>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 mt-6 space-y-6">

        <!-- Card Form Absensi -->
        <div class="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden">
            <div class="p-5 bg-slate-50 border-b border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="clipboard-check" class="text-indigo-600 w-5 h-5"></i>
                    Form Presensi Real-Time
                </h2>
                <p class="text-xs text-slate-500 mt-0.5">Isi data dan ambil foto presensi langsung dari lokasi Anda.</p>
            </div>

            <form id="attendanceForm" class="p-5 space-y-5">
                
                <!-- Input Nama Pekerja (Manual) -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="workerName">
                        Nama Lengkap Pekerja <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="user" class="w-5 h-5"></i>
                        </div>
                        <input type="text" id="workerName" required placeholder="Masukkan nama lengkap Anda"
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-800 font-medium placeholder-slate-400 text-sm">
                    </div>
                </div>

                <!-- Radio Jenis Absensi (Hanya Masuk & Pulang) -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                        Jenis Presensi <span class="text-red-500">*</span>
                    </label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="cursor-pointer border rounded-lg p-3 flex items-center justify-center gap-2 bg-slate-50 border-slate-200 hover:bg-slate-100 has-[:checked]:bg-emerald-50 has-[:checked]:border-emerald-500 has-[:checked]:text-emerald-700 transition-all">
                            <input type="radio" name="attendanceType" value="Masuk" checked class="w-4 h-4 text-emerald-600 focus:ring-emerald-500">
                            <i data-lucide="log-in" class="w-4 h-4 text-emerald-600"></i>
                            <span class="text-sm font-semibold">Absen Masuk</span>
                        </label>
                        <label class="cursor-pointer border rounded-lg p-3 flex items-center justify-center gap-2 bg-slate-50 border-slate-200 hover:bg-slate-100 has-[:checked]:bg-rose-50 has-[:checked]:border-rose-500 has-[:checked]:text-rose-700 transition-all">
                            <input type="radio" name="attendanceType" value="Pulang" class="w-4 h-4 text-rose-600 focus:ring-rose-500">
                            <i data-lucide="log-out" class="w-4 h-4 text-rose-600"></i>
                            <span class="text-sm font-semibold">Absen Pulang</span>
                        </label>
                    </div>
                </div>

                <!-- Kamera & Watermark Canvas -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                        Foto Presensi Timestamp <span class="text-red-500">*</span>
                    </label>
                    
                    <div class="relative bg-black rounded-xl overflow-hidden aspect-[4/3] flex items-center justify-center group shadow-inner">
                        <!-- Live Video Camera -->
                        <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
                        
                        <!-- Preview Hasil Foto Canvas -->
                        <canvas id="canvas" class="w-full h-full object-cover hidden"></canvas>

                        <!-- Loading Indicator Kamera -->
                        <div id="cameraLoading" class="absolute inset-0 bg-slate-900/80 flex flex-col items-center justify-center text-white p-4 text-center">
                            <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-indigo-400 mb-2"></i>
                            <p class="text-xs font-medium text-slate-300">Menghubungkan Kamera & GPS...</p>
                        </div>

                        <!-- Tombol Switch Camera (Front/Back) -->
                        <button type="button" id="switchCamBtn" title="Ganti Kamera" class="absolute top-3 right-3 bg-black/60 hover:bg-black/80 text-white p-2 rounded-full backdrop-blur-md transition-all">
                            <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <!-- Tombol Ambil / Retake Foto -->
                    <div class="mt-3 flex gap-2">
                        <button type="button" id="captureBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 px-4 rounded-lg font-medium text-sm flex items-center justify-center gap-2 shadow-sm transition-all">
                            <i data-lucide="aperture" class="w-4 h-4"></i>
                            Ambil Foto
                        </button>
                        <button type="button" id="retakeBtn" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 py-2.5 px-4 rounded-lg font-medium text-sm flex items-center justify-center gap-2 transition-all">
                            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                            Foto Ulang
                        </button>
                    </div>
                </div>

                <!-- Info GPS Lokasi Real-time -->
                <div class="p-3 bg-indigo-50/70 border border-indigo-100 rounded-lg flex items-start gap-2.5 text-xs text-indigo-900">
                    <i data-lucide="map-pin" class="w-4 h-4 text-indigo-600 shrink-0 mt-0.5"></i>
                    <div>
                        <span class="font-bold">Lokasi GPS Terdeteksi:</span>
                        <p id="locationText" class="text-slate-600 mt-0.5 font-mono">Mencari koordinat presisi...</p>
                    </div>
                </div>

                <!-- Tombol Submit Presensi -->
                <button type="submit" id="submitBtn" disabled class="w-full bg-slate-300 text-slate-500 py-3 px-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2 cursor-not-allowed transition-all shadow-sm">
                    <i data-lucide="send" class="w-4 h-4"></i>
                    Kirim Presensi Ke Google Sheets
                </button>

            </form>
        </div>

    </main>

    <script>
        // CONFIGURATION: Tempel URL Web App dari Google Apps Script di sini
        const GOOGLE_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbx2LV0AGb7coH1YhU70W7QjEAaT61d02eRjbD7Rdm_fUT_E-_cUVY6RsgXGPf68WI5RzQ/exec";

        // Element Selectors
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const retakeBtn = document.getElementById('retakeBtn');
        const switchCamBtn = document.getElementById('switchCamBtn');
        const submitBtn = document.getElementById('submitBtn');
        const cameraLoading = document.getElementById('cameraLoading');
        const locationText = document.getElementById('locationText');
        const attendanceForm = document.getElementById('attendanceForm');

        let stream = null;
        let currentFacingMode = 'environment'; // Kamera belakang default
        let photoCaptured = false;
        let userLocation = { lat: null, lng: null, text: 'Lokasi tidak diketahui' };

        // Initialize App & Lucide Icons
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initCamera();
            initGeolocation();
        });

        // 1. Kamera Handling (HTML5 getUserMedia API)
        async function initCamera() {
            cameraLoading.classList.remove('hidden');
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: currentFacingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    cameraLoading.classList.add('hidden');
                };
            } catch (err) {
                console.error("Camera access error:", err);
                cameraLoading.innerHTML = `
                    <i data-lucide="camera-off" class="w-8 h-8 text-rose-400 mb-2"></i>
                    <p class="text-xs text-rose-200">Gagal menguji kamera. Izinkan akses kamera pada browser Anda.</p>
                `;
                lucide.createIcons();
            }
        }

        // Switch Camera Front/Back
        switchCamBtn.addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            initCamera();
        });

        // 2. Geolocation API
        function initGeolocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(6);
                        const lng = position.coords.longitude.toFixed(6);
                        userLocation = {
                            lat: lat,
                            lng: lng,
                            text: `${lat}, ${lng}`
                        };
                        locationText.innerText = `${userLocation.text} (±${Math.round(position.coords.accuracy)}m)`;
                    },
                    (error) => {
                        console.warn("GPS Error:", error.message);
                        userLocation.text = "GPS Tidak Aktif / Ditolak";
                        locationText.innerText = userLocation.text;
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                userLocation.text = "Browser tidak mendukung GPS";
                locationText.innerText = userLocation.text;
            }
        }

        // 3. Capture Photo & Watermark Canvas Generation
        captureBtn.addEventListener('click', () => {
            const workerNameInput = document.getElementById('workerName').value.trim();
            if (!workerNameInput) {
                alert("Harap isi Nama Pekerja terlebih dahulu sebelum mengambil foto.");
                document.getElementById('workerName').focus();
                return;
            }

            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;

            // Draw Video Frame to Canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Watermark Data
            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' WIB';
            const attendanceType = document.querySelector('input[name="attendanceType"]:checked').value;

            // Render Watermark Banner (Gradient Bottom Box)
            const bannerHeight = canvas.height * 0.26;
            const gradient = ctx.createLinearGradient(0, canvas.height - bannerHeight, 0, canvas.height);
            gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
            gradient.addColorStop(0.3, 'rgba(0, 0, 0, 0.65)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0.9)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, canvas.height - bannerHeight, canvas.width, bannerHeight);

            // Watermark Typography Styling
            const baseFontSize = Math.max(12, Math.floor(canvas.width / 32));
            ctx.fillStyle = '#FFFFFF';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
            ctx.shadowBlur = 4;

            let lineY = canvas.height - bannerHeight + (baseFontSize * 1.5);
            const paddingLeft = canvas.width * 0.04;

            // Line 1: Header Type & Nama Pekerja
            ctx.font = `bold ${baseFontSize * 1.2}px sans-serif`;
            ctx.fillStyle = attendanceType === 'Masuk' ? '#34D399' : '#F87171'; // Green for Masuk, Red for Pulang
            ctx.fillText(`[PRESENSI ${attendanceType.toUpperCase()}] ${workerNameInput}`, paddingLeft, lineY);

            // Line 2: Date & Time Timestamp
            lineY += baseFontSize * 1.4;
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `medium ${baseFontSize}px sans-serif`;
            ctx.fillText(`🕒 ${dateStr} | ${timeStr}`, paddingLeft, lineY);

            // Line 3: GPS Coordinates
            lineY += baseFontSize * 1.3;
            ctx.fillStyle = '#E2E8F0';
            ctx.font = `normal ${baseFontSize * 0.9}px sans-serif`;
            ctx.fillText(`📍 GPS: ${userLocation.text}`, paddingLeft, lineY);

            // Toggle Canvas Preview UI
            video.classList.add('hidden');
            canvas.classList.remove('hidden');
            captureBtn.classList.add('hidden');
            retakeBtn.classList.remove('hidden');

            photoCaptured = true;
            updateSubmitButtonState();
        });

        // Retake Photo Event
        retakeBtn.addEventListener('click', () => {
            video.classList.remove('hidden');
            canvas.classList.add('hidden');
            captureBtn.classList.remove('hidden');
            retakeBtn.classList.add('hidden');
            
            photoCaptured = false;
            updateSubmitButtonState();
        });

        // Form Validation Listener
        document.getElementById('workerName').addEventListener('input', updateSubmitButtonState);

        function updateSubmitButtonState() {
            const workerNameInput = document.getElementById('workerName').value.trim();

            if (workerNameInput && photoCaptured) {
                submitBtn.disabled = false;
                submitBtn.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 px-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2 cursor-pointer transition-all shadow-md shadow-emerald-600/20";
            } else {
                submitBtn.disabled = true;
                submitBtn.className = "w-full bg-slate-300 text-slate-500 py-3 px-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2 cursor-not-allowed transition-all shadow-sm";
            }
        }

        // 4. Submit Data to Google Sheets via Fetch Webhook
        attendanceForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (GOOGLE_WEBHOOK_URL === "GANTI_DENGAN_URL_WEB_APP_GOOGLE_SCRIPT_ANDA" || !GOOGLE_WEBHOOK_URL) {
                alert("URL Google Apps Script belum dipasang! Ikuti panduan integrasi pada Langkah 1 terlebih dahulu.");
                return;
            }

            const workerName = document.getElementById('workerName').value.trim();
            const attendanceType = document.querySelector('input[name="attendanceType"]:checked').value;
            const photoBase64 = canvas.toDataURL('image/png');

            const now = new Date();
            const dateFormatted = now.toLocaleDateString('id-ID', { year: 'numeric', month: '2-digit', day: '2-digit' }) + " " + now.toLocaleTimeString('id-ID');

            const mapsUrl = (userLocation.lat && userLocation.lng) 
                ? `https://maps.google.com/?q=${userLocation.lat},${userLocation.lng}` 
                : "N/A";

            const payload = {
                timestamp: dateFormatted,
                workerName: workerName,
                type: attendanceType,
                location: userLocation.text,
                mapsUrl: mapsUrl,
                photo: photoBase64
            };

            // Loading state on submit button
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Mengirim Data...`;
            lucide.createIcons();

            try {
                const response = await fetch(GOOGLE_WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Penting untuk bypass CORS Google Apps Script
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Tampilan Sukses
                alert(`✅ Presensi Berhasil Dikirim!\n\nNama: ${workerName}\nStatus: Absen ${attendanceType}\nWaktu: ${dateFormatted}`);
                
                // Reset Form UI
                attendanceForm.reset();
                retakeBtn.click();
                updateSubmitButtonState();

            } catch (error) {
                console.error("Submission Error:", error);
                alert("❌ Gagal mengirim presensi. Periksa koneksi internet Anda dan coba lagi.");
            } finally {
                submitBtn.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> Kirim Presensi Ke Google Sheets`;
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
